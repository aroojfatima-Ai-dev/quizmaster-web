<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Test - Step 1')}"></head>
<body>
<div th:replace="~{fragments/layout :: bubbles}"></div>

<div class="canvas">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <div class="page">
        <div class="card card--wide" style="text-align:left;">
            <div class="steps">
                <span class="step-pill step-pill--active">Step 1 of 2 · Test details</span>
                <span class="step-pill">Step 2 · Questions</span>
            </div>

            <div class="card__header" style="text-align:center;">
                <h1 class="title title--teacher">Create Test - Step 1 of 2</h1>
                <p class="subtitle">Enter overall test details and visibility below</p>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form method="post" th:action="@{/teacher/tests/new}">
                <div class="field">
                    <label for="title">Test Title:</label>
                    <input type="text" id="title" name="title" maxlength="200" required
                           th:value="${details != null ? details.title : titleValue}"
                           placeholder="e.g. Chapter 4 - Cell Biology"/>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="language">Language:</label>
                        <select id="language" name="language">
                            <option value="English"
                                    th:selected="${details == null || details.language == 'English'}">English</option>
                            <option value="Urdu" th:selected="${details != null && details.language == 'Urdu'}">
                                Urdu (right to left)
                            </option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="durationMinutes">Duration (Minutes):</label>
                        <input type="number" id="durationMinutes" name="durationMinutes" min="1" max="1440" required
                               th:value="${details != null ? details.totalTimeSeconds / 60 : durationValue}"
                               placeholder="e.g. 15"/>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">Expiry Action:</span>
                    <div class="radio-row">
                        <label class="radio-pill">
                            <input type="radio" name="expiryAction" value="AUTO_SUBMIT"
                                   th:checked="${details == null || details.expiryAction == 'AUTO_SUBMIT'}"/>
                            <span>Auto-submit when the time is up</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="expiryAction" value="ALLOW_OVERTIME"
                                   th:checked="${details != null && details.expiryAction == 'ALLOW_OVERTIME'}"/>
                            <span>Allow overtime (recorded)</span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">Test Visibility:</span>
                    <div class="radio-row">
                        <label class="radio-pill">
                            <input type="radio" name="visibility" value="public" id="visibilityPublic"
                                   th:checked="${details == null || details.publicTest}"/>
                            <span>Public - every student can see it</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="visibility" value="class" id="visibilityClass"
                                   th:checked="${details != null && !details.publicTest}"/>
                            <span>Class only</span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <label for="classId">Class (only for a class-only test)</label>
                    <select id="classId" name="classId">
                        <option value="">— none / public test —</option>
                        <option th:each="classRoom : ${classes}" th:value="${classRoom.id}"
                                th:text="|${classRoom.className} (${classRoom.classCode})|"
                                th:selected="${details != null && details.classId != null and details.classId == classRoom.id}">
                            Physics 101 (PHY101)
                        </option>
                    </select>
                    <p class="hint" th:if="${classes.isEmpty()}">
                        You have no classes yet. Create one from "My Classes" first, or make this test public.
                    </p>
                </div>

                <div class="nav-row">
                    <a class="btn btn--ghost" th:href="@{/teacher/dashboard}">← Back to Dashboard</a>
                    <span class="spacer"></span>
                    <button class="btn btn--primary" type="submit">Next →</button>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
