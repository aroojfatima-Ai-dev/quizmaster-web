# ===========================================================================
#  QuizMaster Web
# ===========================================================================
#  Everything here can be overridden with an environment variable, which is
#  how Railway configures the deployed container.
#
#  The database connection is resolved in Java (see
#  com.quizmaster.db.DbEnvironmentPostProcessor) so that a Railway Postgres
#  plugin, a Railway MySQL plugin, plain DB_* variables and a zero-setup H2
#  file database are all handled without editing this file.
# ===========================================================================

spring.application.name=QuizMaster Web

# Railway injects PORT; locally this falls back to 8080.
server.port=${PORT:8080}
# Railway terminates TLS in front of the container.
server.forward-headers-strategy=framework
server.servlet.session.timeout=3h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=${QUIZMASTER_THYMELEAF_CACHE:true}

# Question-file uploads (PDF / DOCX / TXT).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.jpa.hibernate.ddl-auto=${QUIZMASTER_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# Error pages: keep the app's own screens instead of the Whitelabel page.
server.error.whitelabel.enabled=false

# Seed the demo teacher / student / class / sample test on an empty database.
# Set QUIZMASTER_DEMO_SEED=false to turn it off.
quizmaster.demo-seed=${QUIZMASTER_DEMO_SEED:true}

# Where the zero-configuration H2 database file lives (used only when no
# Postgres/MySQL connection variables are present).
quizmaster.data-dir=${QUIZMASTER_DATA_DIR:./data}
